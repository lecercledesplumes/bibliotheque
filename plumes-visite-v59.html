<body><div id="m">Chargement de la visite…</div>
<script>
var P=[["let musicEl=null,sndOn=true;", "let musicEl=null,sndOn=true;\nlet MUSK=.55,musDk=0;\nfunction musVol(){try{if(musicEl)musicEl.volume=musDk?.06:MUSK;}catch(e){}}\nwindow.musDuck=function(on){musDk=on;musVol();};\nasync function musStart(){\n if(window.__musOn)return;window.__musOn=1;\n const a=new Audio();a.preload='auto';a.setAttribute('playsinline','');musicEl=a;musVol();\n let L=[];\n try{L=(await fbList('music')).filter(x=>x.hm&&+x.n>=1&&+x.n<=5).sort((p,q)=>+p.n-+q.n);}catch(e){}\n if(!L.length)return;\n const U={};let i=0,bad=0;\n const load=async n=>{if(!U[n]){const d=await medGet('music_m'+n);if(d)U[n]=d;}return U[n]||'';};\n const playN=async()=>{\n  const x=L[i%L.length];const d=await load(x.n);\n  if(!d){bad++;i++;if(bad<=L.length*2)setTimeout(playN,400);return;}\n  bad=0;a.src=d;\n  try{await a.play();}catch(e){document.addEventListener('pointerdown',()=>{a.play().catch(()=>{});},{once:true});}\n };\n a.onended=()=>{i++;playN();};\n document.addEventListener('visibilitychange',()=>{try{if(document.hidden)a.pause();else if(a.src)a.play().catch(()=>{});}catch(e){}});\n playN();\n}\n"], ["$('go').onclick=()=>{audioInit();", "$('go').onclick=()=>{audioInit();try{musStart();}catch(e){}"], ["window.auPlay&&window.auPlay();", "window.auPlay&&window.auPlay();window.musDuck&&window.musDuck(1);"], ["window.auStop&&window.auStop();", "window.auStop&&window.auStop();window.musDuck&&window.musDuck(0);"], ["function updFx(dt,tm){", "function updFx(dt,tm){{const c=cam.position,q=window.__cq||(window.__cq=[c.x,c.z]);const mv=Math.hypot(c.x-q[0],c.z-q[1])/Math.max(dt,.001);q[0]=c.x;q[1]=c.z;window.__still=mv>.15?0:(window.__still||0)+dt;}"], ["if(Math.abs(e)>.55)b.tg=ta;", "if(Math.abs(e)>.55&&(window.__still||0)>.6)b.tg=ta;"]];
(async function(){
 var m=document.getElementById('m');
 try{

 }catch(e){m.textContent='Problème : '+(e&&e.message?e.message:e)}
})();
